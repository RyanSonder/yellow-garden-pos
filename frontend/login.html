<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .login-box {
        background: white;
        padding: 30px;
        width: 300px;
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    h1 {
        text-align: center;
        margin-top: 0;
    }

    input {
        box-sizing: border-box;
        width: 100%;
        padding: 10px;
        margin-bottom: 12px;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #333;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    button:hover {
        background: #555;
    }

    #message {
        margin-top: 15px;
        text-align: center;
        color: #b30000;
    }
</style>
```

</head>

<body>

<div class="login-box">

```
<h1>POS Login</h1>

<form id="loginForm">

    <input
        type="text"
        id="username"
        placeholder="Username"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

<div id="message"></div>
```

</div>

<script>

const API_URL = "http://127.0.0.1:8000";

document
    .getElementById("loginForm")
    .addEventListener("submit", async event => {

        event.preventDefault();

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");

        try {

            const response = await fetch(
                `${API_URL}/login?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`,
                {
                    method: "POST"
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "Login failed");
            }

            localStorage.setItem(
                "token",
                data.access_token
            );

            window.location.href = "index.html";

        } catch (error) {

            message.textContent = error.message;

        }

    });

</script>

</body>
</html>
